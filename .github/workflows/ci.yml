name: CI / Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write        # create tags & GitHub releases
  issues: write          # semantic-release can comment on issues
  pull-requests: write   # semantic-release can comment on PRs

jobs:
  # 1. Test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  # 2. Semantic Release
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      released:       ${{ steps.semrel.outputs.new_release_published }}
      version:        ${{ steps.semrel.outputs.new_release_version }}
      version_major:  ${{ steps.semrel.outputs.new_release_major_version }}
      version_minor:  ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
